name: Publish Docker images

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string
      push_latest:
        description: Also publish latest
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: app, image: hanori }
          - { target: quote-worker, image: hanori-quote-worker }
          - { target: media-worker, image: hanori-media-worker }
          - { target: coding-worker, image: hanori-coding-worker }
          - { target: coding-egress-proxy, image: hanori-coding-egress-proxy }
          - { target: lody-bridge, image: hanori-lody-bridge }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ && "$IMAGE_TAG" != latest ]]

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || inputs.push_latest == true }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
