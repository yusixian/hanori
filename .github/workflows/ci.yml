name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan checked-out source for credentials
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            dir /repo --config /repo/.gitleaks.toml --redact=100 --no-banner

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install FFmpeg for media tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install pinned yt-dlp for extractor tests
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          python3 -m venv "$RUNNER_TEMP/bilibili-ytdlp"
          "$RUNNER_TEMP/bilibili-ytdlp/bin/pip" install -r infrastructure/bilibili-ytdlp/requirements.txt
          echo "$RUNNER_TEMP/bilibili-ytdlp/bin" >> "$GITHUB_PATH"

      - name: Validate Dokploy Compose
        run: pnpm deploy:dokploy:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      # Build before typecheck so emitted declarations cannot hide clean-build failures.
      - name: Production build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Check translations
        run: pnpm i18n:check

      - name: Unit tests
        run: pnpm test --maxWorkers=4

      - name: Install Chromium
        run: pnpm --filter @cos-tool-bot/panel exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser

      - name: Public documentation browser tests
        run: pnpm test:docs

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_READY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Promote the tested commit
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          READY_URL: ${{ vars.PRODUCTION_READY_URL }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit is awaiting its own checks."
            exit 0
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/production" \
            -f sha="$GITHUB_SHA" -F force=false --silent
          if curl -fsS --max-time 10 "$READY_URL" | jq -e --arg sha "$GITHUB_SHA" \
            '.status == "ready" and .version == $sha' >/dev/null; then
            echo "Production already serves this commit."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the Dokploy Compose deployment
        if: steps.promote.outputs.deploy == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          payload=$(jq -nc --arg sha "$GITHUB_SHA" \
            '{ref:"refs/heads/production", after:$sha, head_commit:{id:$sha, message:"Deploy tested main commit"}}')
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' --data "$payload" "$DEPLOY_HOOK")
          [[ "$status" == 200 ]] || { echo "Dokploy returned HTTP $status"; exit 1; }

      - name: Verify the deployed commit
        if: steps.promote.outputs.deploy == 'true'
        env:
          READY_URL: ${{ vars.PRODUCTION_READY_URL }}
        run: |
          for attempt in {1..80}; do
            if curl -fsS --max-time 8 "$READY_URL" | jq -e --arg sha "$GITHUB_SHA" \
              '.status == "ready" and .version == $sha' >/dev/null; then
              echo "Production is ready at $GITHUB_SHA."
              exit 0
            fi
            sleep 12
          done
          echo "Production did not report the tested commit before the deadline."
          exit 1
