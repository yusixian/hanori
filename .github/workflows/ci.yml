name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # Self-hosted runner on the maintainer's Mac; see readme "CI / Self-hosted Runner".
    # Jobs remain queued while the local runner service is offline.
    runs-on: [self-hosted, macOS, ARM64, cos-tool-bot]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pinned yt-dlp for extractor tests
        run: |
          # setup-python's macOS archives assume /Users/runner on hosted runners.
          /opt/homebrew/bin/python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          /opt/homebrew/bin/python3 -m venv "$RUNNER_TEMP/bilibili-ytdlp"
          "$RUNNER_TEMP/bilibili-ytdlp/bin/pip" install -r infrastructure/bilibili-ytdlp/requirements.txt
          echo "$RUNNER_TEMP/bilibili-ytdlp/bin" >> "$GITHUB_PATH"

      - name: Validate Dokploy Compose
        run: pnpm deploy:dokploy:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      # Build before typecheck so emitted declarations cannot hide clean-build failures.
      - name: Production build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Check translations
        run: pnpm i18n:check

      - name: Unit tests
        # Bound process-heavy Git/CLI fixtures on the shared self-hosted runner.
        run: pnpm test --maxWorkers=4

      - name: Install Chromium
        # Playwright's --with-deps option is only supported on Debian/Ubuntu.
        run: pnpm --filter @cos-tool-bot/panel exec playwright install chromium

      - name: Browser tests
        run: pnpm test:browser

      - name: Public documentation browser tests
        run: pnpm test:docs
