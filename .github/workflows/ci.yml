name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install pinned yt-dlp for extractor tests
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          python3 -m venv "$RUNNER_TEMP/bilibili-ytdlp"
          "$RUNNER_TEMP/bilibili-ytdlp/bin/pip" install -r infrastructure/bilibili-ytdlp/requirements.txt
          echo "$RUNNER_TEMP/bilibili-ytdlp/bin" >> "$GITHUB_PATH"

      - name: Validate Dokploy Compose
        run: pnpm deploy:dokploy:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      # Build before typecheck so emitted declarations cannot hide clean-build failures.
      - name: Production build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Check translations
        run: pnpm i18n:check

      - name: Unit tests
        run: pnpm test --maxWorkers=4

      - name: Install Chromium
        run: pnpm --filter @cos-tool-bot/panel exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser

      - name: Public documentation browser tests
        run: pnpm test:docs
