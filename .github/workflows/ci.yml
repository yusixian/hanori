name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check translations
        run: pnpm i18n:check

      - name: Unit tests
        run: pnpm test

      - name: Install Chromium
        run: pnpm --filter @cos-tool-bot/panel exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser
