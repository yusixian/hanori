services:
  app:
    build: .
    ports:
      - "${PORT:-9600}:3000"
    environment:
      - DATABASE_URL=postgresql://bot:${DB_PASSWORD}@db:5432/cos_tool_bot
      - BOT_TOKEN=${BOT_TOKEN}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - AUTH_OWNER_EMAIL=${AUTH_OWNER_EMAIL}
      - PANEL_PASSWORD=${PANEL_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ADMIN_CHAT_IDS=${ADMIN_CHAT_IDS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-}
      - BACKUP_DIR=/data/backups
      - NSFW_API_URL=${NSFW_API_URL:-http://nsfw-api:3000}
      - CODING_WORKER_URL=${CODING_WORKER_URL:-http://coding-worker:3010}
      - CODING_WORKER_SECRET=${CODING_WORKER_SECRET:-}
      - CODING_WORKSPACES_DIR=/workspaces
      - CODING_GIT_DIR=/git-metadata
      - CODING_WORKSPACE_UID=1000
      - CODING_WORKSPACE_GID=1000
    volumes:
      - backups:/data/backups
      - botdata:/app/data
      - codeworkspaces:/workspaces
      - codegit:/git-metadata
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s

  coding-worker:
    profiles: ["coding"]
    build:
      context: .
      target: coding-worker
    environment:
      - CODING_WORKER_SECRET=${CODING_WORKER_SECRET:-}
      - CODING_WORKER_PORT=3010
      - CODING_WORKSPACES_DIR=/workspaces
    volumes:
      - codeworkspaces:/workspaces
      - codegit:/git-metadata:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s

  nsfw-api:
    image: ghcr.io/arnidan/nsfw-api:latest
    ports:
      - "${NSFW_API_PORT:-9601}:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=bot
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cos_tool_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d cos_tool_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 128M
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=192MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "log_min_duration_statement=1000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: "192mb"

volumes:
  pgdata:
  backups:
  botdata:
  codeworkspaces:
  codegit:
