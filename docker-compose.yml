services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://bot:${DB_PASSWORD}@db:5432/cos_tool_bot
      - BOT_TOKEN=${BOT_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - PANEL_PASSWORD=${PANEL_PASSWORD}
      - ADMIN_CHAT_IDS=${ADMIN_CHAT_IDS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - ENABLE_S3_BACKUP=${ENABLE_S3_BACKUP:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - BACKUP_FILE_PREFIX=${BACKUP_FILE_PREFIX:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=bot
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cos_tool_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d cos_tool_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
