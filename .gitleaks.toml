title = "Public source credential checks"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact synthetic secret used only to render Compose validation"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)scripts/check-dokploy-compose\.mjs$''']
regexes = ['''^validation-secret-at-least-32-characters$''']
