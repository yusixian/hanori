# Dev Harness control-plane config. Copy outside the repository, point HARNESS_CONFIG_PATH at it,
# and restart the server. Only telegram.bot/chatId/owners are required; projects can also be
# added from the panel's Dev Harness page. Every other field below shows its default.
# Field reference: docs/design/dev-harness-config.md.
version: 1

telegram:
  bot: example-dev # Bot id or name in the Bots table; only this Bot enables the harness
  chatId: -1001234567890 # forum supergroup; the Bot needs admin with can_manage_topics
  owners: [123456789] # only these Telegram user ids may run commands or press buttons
  chat:
    casualReplies: false # no casual AI replies or JEV engagement in the harness group
  cards:
    screenshot: first # none | first — first image in the PR body becomes the card photo
    summary: ai # ai | title — ai uses the harness Bot's active AI provider

approvals:
  ttl: 7d # card buttons stay valid this long, across restarts
  mergeConfirm: once # once | twice

executors:
  lody:
    cli: lody # local CLI, used only when the bridge URL env var is empty
    bridge: # lody-bridge sidecar; values come from these env vars (see docs/DEV_HARNESS_LODY.md)
      urlEnv: HARNESS_LODY_BRIDGE_URL
      secretEnv: HARNESS_LODY_BRIDGE_SECRET
    timeout: 20s
    agentConfig: Codex # Lody agent config (name or id) the lead runs with unless roles.worker.agent is set
    models: {} # replaces the panel's model list per agent type, e.g. { codex: [{ id: gpt-6-sol, name: GPT-6 Sol, efforts: [high] }] }
    poll: { active: 20s, idle: 2m }
    turnWait: 2h # harness-started turns run with --wait so their end is reported at once; null polls only
    sessionUrl: null # e.g. https://<lody web>/sessions/{sessionId}; null shows the id instead

roles: # the panel's execution settings sit above these; subworker/reviewer follow the lead's vendor
  worker: { effort: high } # the /bug lead; model defaults to gpt-6-sol for Codex, the agent default otherwise

guardrails:
  concurrency: { perMachine: 4, perProject: 3, sameAreaWriters: 1 }
  time: { idleRemindAfter: 45m, runRemindAfter: 6h, hardCancelAfter: null }
  autoFixRounds: 2
  quota:
    pauseAt: { fiveHour: 95%, week: 90% }
    warnAt: { week: 75% }
    fallback: {} # e.g. { worker: haiku } to switch models instead of pausing
    dailySessionCap: null
  autonomy:
    bugStartsImmediately: true

machines:
  mbp: { lody: Mac-Runner }
  windows-runner: { lody: Windows-Runner, enabled: false }

github:
  mergeMethod: squash
  deleteBranchOnMerge: true
  requireChecks: all # all | required (branch protection's required checks)
  webhookSecretEnv: HARNESS_GITHUB_WEBHOOK_SECRET
  acceptPullRequests: harness-only # harness-only | all
  trustedAuthors: [] # GitHub logins whose same-repo PRs get cards and whose comments may use the protocol
  labelPrefix: "harness:" # harness:bug starts a request; harness:revise marks feedback rounds

projects: # optional; YAML projects are read-only in the panel and win on a key or repo clash
  sandbox:
    repo: example-owner/harness-sandbox
    topic: auto # auto creates the topic once; or a thread id / existing:<thread id>
    machines: [mbp]
