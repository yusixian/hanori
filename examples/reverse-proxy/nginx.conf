# Include this file inside the existing http {} block.
map $http_upgrade $hanori_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name bot.example.com;
    return 308 https://bot.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name bot.example.com;

    ssl_certificate     /etc/nginx/tls/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/bot.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:43100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This template assumes Nginx receives public traffic directly.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hanori_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
