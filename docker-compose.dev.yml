services:
  nsfw-api:
    image: ghcr.io/arnidan/nsfw-api:latest
    ports:
      - "${NSFW_API_PORT:-9601}:3000"

  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=bot
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cos_tool_bot
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d cos_tool_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
